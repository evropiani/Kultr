<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kultr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Kultr — a modern, minimalist music client for your Navidrome server, with crossfade and InjeKt mixing." />
    <meta name="color-scheme" content="dark light" />
    <title>Kultr</title>
    <style>
      /* Painted before the bundle loads so there is never a white flash. */
      html, body { margin: 0; background: #0b0b0f; }
      html[data-theme='light'], html[data-theme='light'] body { background: #eef0f5; }
      #kultr-boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.5); letter-spacing: 0.04em;
      }
      html[data-theme='light'] #kultr-boot { color: rgba(0, 0, 0, 0.45); }
      #kultr-boot span { animation: kultr-pulse 1.6s ease-in-out infinite; }
      #kultr-boot[data-error] {
        display: block; place-items: initial; padding-top: 12vh; overflow: auto;
        color: rgba(255, 255, 255, 0.82); letter-spacing: normal;
      }
      html[data-theme='light'] #kultr-boot[data-error] { color: rgba(0, 0, 0, 0.78); }
      #kultr-boot[data-error] code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em;
        padding: 1px 5px; border-radius: 5px; background: rgba(128, 128, 128, 0.22);
      }
      @keyframes kultr-pulse { 0%, 100% { opacity: 0.35 } 50% { opacity: 0.9 } }
      @media (prefers-reduced-motion: reduce) { #kultr-boot span { animation: none } }
    </style>
    <script>
      // Restore the saved theme synchronously to avoid a flash of the wrong one.
      try {
        var saved = JSON.parse(localStorage.getItem('kultr.settings') || '{}');
        var t = (saved && saved.state && saved.state.theme) || 'dark';
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* first run, defaults are fine */ }

      // Boot watchdog.
      //
      // If the bundle never executes, the splash below would pulse forever and
      // tell you nothing. That is a miserable way to find out your host is
      // misconfigured, so we say what went wrong instead.
      (function () {
        function explain(why, fix) {
          var boot = document.getElementById('kultr-boot');
          var root = document.getElementById('root');
          // Nothing to say if the app took over, and never talk over an
          // explanation that is already on screen — the instant one below is
          // more specific than anything the timer can work out later.
          if (!boot || boot.hasAttribute('data-error')) return;
          if (root && root.childElementCount > 0) return;
          boot.innerHTML =
            '<div style="max-width:640px;margin:0 auto;padding:28px;text-align:left;line-height:1.65;font-size:14px">' +
            '<div style="font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px">Kultr did not start</div>' +
            '<p style="margin:0 0 14px">' + why + '</p>' +
            '<p style="margin:0 0 14px">' + fix + '</p>' +
            '<p style="margin:0;opacity:0.75">Full instructions: ' +
            '<a style="color:inherit" href="https://github.com/evropiani/Kultr/blob/main/docs/INSTALL.md">docs/INSTALL.md</a>' +
            '</p></div>';
          boot.setAttribute('data-error', '');
        }

        // The unbuilt-source case is visible the moment the document is
        // parsed — this page is still asking for /src/main.tsx, which no
        // browser can run. There is nothing to wait for, so say so at once
        // rather than pulsing a logo for eight seconds first.
        document.addEventListener('DOMContentLoaded', function () {
          if (!document.querySelector('script[src$=".tsx"], script[src$=".ts"]')) return;
          explain(
            'This page is the <strong>source</strong> of Kultr, not a build of it. It is asking the browser for <code>/src/main.tsx</code>, which is TypeScript — browsers cannot run that.',
            'On GitHub Pages: <strong>Settings → Pages → Build and deployment → Source → GitHub Actions</strong>. “Deploy from a branch” publishes the repository as-is, which is what you are seeing. Leaving it on a branch also lets GitHub’s own Jekyll build race the real one, so the site can work after one push and break after the next.'
          );
        });

        // Everything else — a failed download, a wrong base path — can only be
        // diagnosed by waiting to see whether the app ever takes over.
        window.addEventListener('load', function () {
          setTimeout(function () {
            explain(
              'The app bundle did not load. It may have failed to download, or the page is being served from the wrong path.',
              'Check the browser console for the failing request, and that the app was built with the right base path (<code>KULTR_BASE</code>).'
            );
          }, 8000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="kultr-boot"><span>KULTR</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
