name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:only

      - name: Check the built app looks sane
        run: |
          test -f dist/index.html || { echo "no index.html in dist"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "no web manifest"; exit 1; }
          test -f dist/sw.js || { echo "no service worker"; exit 1; }
          ls dist/assets/*.js >/dev/null || { echo "no JS bundle"; exit 1; }
          echo "dist looks good:"
          du -sh dist
