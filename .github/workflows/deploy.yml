name: Deploy to GitHub Pages

# Publishes the live demo at https://evropiani.github.io/Kultr/ so people can
# try Kultr before installing anything. The demo is just the client — it holds
# no music and no credentials; visitors point it at their own Navidrome.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - uses: actions/configure-pages@v5
        id: pages
        with:
          # Creates the Pages site if there is not one yet. Note that it does
          # *not* move an existing site off "Deploy from a branch" — hence the
          # check below.
          enablement: true

      - name: Make sure Pages publishes from Actions, not from the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A repository left on "Deploy from a branch" publishes itself
          # verbatim: an index.html asking for /src/main.tsx, which no browser
          # can run. Worse, GitHub then runs its own Jekyll build on every push
          # alongside this workflow — two publishers, one site, last one wins.
          # The site works or breaks depending on which finishes first, which
          # is not a thing anyone should have to debug twice.
          #
          # configure-pages only *creates* a Pages site; it will not move an
          # existing one off a branch. So do that here, with the pages:write
          # permission this workflow already holds.
          build_type() {
            gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown
          }

          BEFORE="$(build_type)"
          echo "Pages build type: $BEFORE"

          if [ "$BEFORE" = "legacy" ]; then
            echo "Switching the Pages source from a branch to GitHub Actions…"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow || true
            AFTER="$(build_type)"
            echo "Pages build type is now: $AFTER"
            if [ "$AFTER" != "workflow" ]; then
              echo "::error::Pages is set to 'Deploy from a branch', which publishes this repository as-is and races this workflow, and it could not be changed automatically. Fix it at Settings -> Pages -> Build and deployment -> Source -> GitHub Actions."
              exit 1
            fi
            echo "::notice::Pages was publishing from a branch and has been switched to GitHub Actions."
          elif [ "$BEFORE" != "workflow" ]; then
            echo "::warning::Could not read the Pages build type (got '$BEFORE'); continuing."
          fi

      - name: Work out the public base path
        id: base
        run: |
          # A project site lives under /<repo>/, a user site at /. Normalise
          # whatever configure-pages reports into a value with one trailing
          # slash, which is what Vite wants.
          BASE="${{ steps.pages.outputs.base_path }}"
          [ -z "$BASE" ] && BASE="/"
          case "$BASE" in */) ;; *) BASE="$BASE/" ;; esac
          echo "Building for base path: $BASE"
          echo "value=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          KULTR_BASE: ${{ steps.base.outputs.value }}
        run: npm run build:only

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages has no rewrite rules, so a deep link like
          # /Kultr/album/xyz would 404. Serving the app as the 404 page makes
          # the router pick the URL up instead.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
