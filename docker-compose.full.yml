# The whole stack: Navidrome + Kultr, one command, nothing else to configure.
#
#   1. Point MUSIC_DIR at your music folder (or edit the volume below).
#   2. docker compose -f docker-compose.full.yml up -d
#   3. Navidrome: http://localhost:4533  — create your account here first.
#      Kultr:     http://localhost:4180  — log in with that account, leaving
#                                          the server field blank.
#
# Kultr proxies /rest to the navidrome service over the internal Docker
# network, so the browser only ever talks to one address.

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - '4533:4533'
    environment:
      ND_SCANSCHEDULE: '1h'
      ND_LOGLEVEL: 'info'
      ND_SESSIONTIMEOUT: '24h'
      # Kultr reads ReplayGain tags for volume levelling when they exist.
      ND_ENABLEREPLAYGAIN: 'true'
      # Lets Kultr show synced lyrics from .lrc files and tags.
      ND_ENABLEEXTERNALSERVICES: 'true'
    volumes:
      - ./navidrome/data:/data
      - ${MUSIC_DIR:-./music}:/music:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4533/ping']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  kultr:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/evropiani/kultr:latest
    container_name: kultr
    restart: unless-stopped
    ports:
      - '4180:4180'
    environment:
      # Service name on the compose network — no host ports involved.
      KULTR_NAVIDROME_URL: 'http://navidrome:4533'
      PORT: '4180'
    depends_on:
      navidrome:
        condition: service_healthy
