# nginx: serve Kultr and Navidrome from one hostname.
#
# Put this in /etc/nginx/sites-available/kultr (or conf.d/kultr.conf), adjust
# the paths and server_name, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# One address for the app and the API means no CORS configuration anywhere.

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    # Let's Encrypt will rewrite this block when you run certbot. Until then,
    # note that the offline/PWA features need HTTPS (localhost is exempt).
    # certbot --nginx -d music.example.com

    # Album art and audio can be large; do not buffer whole responses to disk.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;

    # The Subsonic API that Kultr talks to.
    location /rest/ {
        proxy_pass http://127.0.0.1:4533;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming uses range requests; pass them straight through.
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Public share links served by Navidrome.
    location /share/ {
        proxy_pass http://127.0.0.1:4533;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Kultr itself: the built static files.
    location / {
        root /srv/kultr/dist;
        index index.html;
        # Deep links such as /album/abc must fall back to the app.
        try_files $uri $uri/ /index.html;

        # Hashed assets never change; the shell must not be cached.
        location /assets/ {
            root /srv/kultr/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location = /index.html {
            root /srv/kultr/dist;
            add_header Cache-Control "no-cache";
        }
        location = /sw.js {
            root /srv/kultr/dist;
            add_header Cache-Control "no-cache";
        }
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}

# --- Proxying the Node server instead of serving files ----------------------
#
# If you run `npm run serve` (or the Docker image), replace the `location /`
# block above with:
#
#     location / {
#         proxy_pass http://127.0.0.1:4180;
#         proxy_set_header Host $host;
#         proxy_http_version 1.1;
#     }
